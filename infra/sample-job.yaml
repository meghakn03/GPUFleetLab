apiVersion: batch/v1
kind: Job
metadata:
  generateName: foundation-train-
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: gpu-queue
    kueue.x-k8s.io/priority-class: batch
spec:
  suspend: true
  parallelism: 4
  completions: 4
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
      containers:
        - name: simulated-worker
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
